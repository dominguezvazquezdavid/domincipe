# Environment-independent configuration only. Anything that differs between local, dev and obs
# comes from environment variables (PROJECT.md §7), never from this file.
spring:
  application:
    name: api-gateway

# Correlation id of the in-flight request, published in the MDC by common-observability.
# The empty default keeps the token harmless when a log line is written outside a request.
logging:
  pattern:
    correlation: "[requestId=%X{requestId:-}] "
