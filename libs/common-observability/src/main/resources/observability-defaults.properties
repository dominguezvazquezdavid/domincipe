# Operational defaults contributed by common-observability at the lowest precedence.
# Every value can be overridden by the service (application.yml, profile or environment).
#
# Actuator: /actuator/health is exposed by default; prometheus has to be added. Liveness and
# readiness groups hang off the health endpoint, which is why health stays in the list.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
#
# Java 21 virtual threads for request handling (PROJECT.md §4).
spring.threads.virtual.enabled=true
#
# Graceful shutdown: stop accepting requests and drain the in-flight ones (PROJECT.md §9).
# "graceful" is already the default of Boot 4.1.2 (verified in its configuration metadata);
# pinning it keeps the guarantee if a future upgrade changes that default.
server.shutdown=graceful
# Drain window. Boot's default is 30s as well; it is declared so the value is visible and can be
# overridden per environment with SPRING_LIFECYCLE_TIMEOUTPERSHUTDOWNPHASE.
spring.lifecycle.timeout-per-shutdown-phase=30s
#
# API documentation (service-runtime spec, design D16): a single switch turns both the
# specification and the UI off, without touching code or the image. Placeholders are resolved when
# springdoc binds its own properties, and the defaults are overridable per service as usual.
springdoc.api-docs.enabled=${APP_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_DOCS_ENABLED:true}
