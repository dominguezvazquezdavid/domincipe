# React Router owns client-side paths, so any unknown URL must serve the
# application shell instead of nginx's 404 (design D11). The unprivileged image
# already runs as a non-root user and listens on 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
